name: validate

# push のたびに台帳データを検証する（仕様書 §7）。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 台帳データを検証
        run: node tools/validate.mjs
